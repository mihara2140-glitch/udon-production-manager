<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 製麺管理アプリ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="form-page">
    <main class="form-shell" style="max-width:560px;">
        <div class="form-header">
            <div>
                <p class="eyebrow">PRIVATE ACCESS</p>
                <h1>製麺管理アプリ</h1>
                <p class="header-copy">公開版はパスワードで保護されています。</p>
            </div>
        </div>

        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

        <section class="panel form-panel">
            <form method="post" autocomplete="off">
                <label class="field">
                    <span>パスワード</span>
                    <input type="password" name="password" autocomplete="current-password" required autofocus>
                </label>
                <div class="form-actions">
                    <button class="primary-button" type="submit">ログイン</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
